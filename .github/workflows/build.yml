name: Build Android APK

on:
  workflow_dispatch: # 支持手动点击按钮触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 使用 3.24.0 这个最稳的版本，3.38 太新了，容易翻车
          flutter-version: "3.24.0"
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: simple_live_app
        run: flutter pub get

      # 【核心修复】强行向系统注入版本信息，绕过那个 null cannot be cast 报错
      - name: Fix Gradle Null Pointer
        run: |
          mkdir -p simple_live_app/android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > simple_live_app/android/local.properties
          echo "flutter.sdk=$FLUTTER_HOME" >> simple_live_app/android/local.properties
          echo "flutter.versionName=1.0.0" >> simple_live_app/android/local.properties
          echo "flutter.versionCode=1" >> simple_live_app/android/local.properties
          cat simple_live_app/android/local.properties

      - name: Build APK
        working-directory: simple_live_app
        # 增加 --no-tree-shake-icons 防止有些图标编译不过
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons --build-name=1.0.0 --build-number=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-APK
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
