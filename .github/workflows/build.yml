name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9" 
          channel: 'stable'

      - name: Pub get
        working-directory: simple_live_app
        run: flutter pub get

      # 【核心路径修复】使用绝对路径生成签名文件
      - name: Hack Signature with Absolute Paths
        run: |
          # 定义绝对路径变量
          BASE_PATH=$GITHUB_WORKSPACE/simple_live_app/android/app
          mkdir -p $BASE_PATH
          
          # 1. 生成签名证书
          keytool -genkey -v -keystore $BASE_PATH/key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -dname "CN=Fake" -storepass 123456 -keypass 123456
          
          # 2. 在 app 目录下生成 key.properties，并使用绝对路径指向 jks
          echo "storePassword=123456" > $BASE_PATH/key.properties
          echo "keyPassword=123456" >> $BASE_PATH/key.properties
          echo "keyAlias=upload" >> $BASE_PATH/key.properties
          echo "storeFile=$BASE_PATH/key.jks" >> $BASE_PATH/key.properties
          
          # 3. 在 android 目录下也备一份，防止 Gradle 找不到
          cp $BASE_PATH/key.properties $GITHUB_WORKSPACE/simple_live_app/android/key.properties
          
          # 4. 再次确保 local.properties 包含绝对路径的 SDK 信息
          echo "sdk.dir=$ANDROID_SDK_ROOT" > $GITHUB_WORKSPACE/simple_live_app/android/local.properties
          echo "flutter.sdk=$FLUTTER_HOME" >> $GITHUB_WORKSPACE/simple_live_app/android/local.properties
          echo "flutter.versionName=1.0.0" >> $GITHUB_WORKSPACE/simple_live_app/android/local.properties
          echo "flutter.versionCode=1" >> $GITHUB_WORKSPACE/simple_live_app/android/local.properties

      - name: Build APK
        working-directory: simple_live_app
        # 加入 --no-pub 减少重复检查，直接打包
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons --no-pub --build-name=1.0.0 --build-number=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-APK
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
