name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 升级到 3.27.0，这个版本对 intl 0.20.x 的兼容性更好
          flutter-version: "3.27.0"
          channel: 'stable'
          cache: true

      # 【核心修复点 1】强行升级项目依赖，解决 intl 版本冲突
      - name: Upgrade Dependencies
        working-directory: simple_live_app
        run: flutter pub upgrade

      # 【核心修复点 2】继续保留之前的 Gradle 补丁
      - name: Fix Gradle Null Pointer
        run: |
          mkdir -p simple_live_app/android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > simple_live_app/android/local.properties
          echo "flutter.sdk=$FLUTTER_HOME" >> simple_live_app/android/local.properties
          echo "flutter.versionName=1.0.0" >> simple_live_app/android/local.properties
          echo "flutter.versionCode=1" >> simple_live_app/android/local.properties

      - name: Build APK
        working-directory: simple_live_app
        # 增加 --no-pub 确保它用我们刚才 upgrade 过的依赖环境
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons --no-pub --build-name=1.0.0 --build-number=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-APK
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
