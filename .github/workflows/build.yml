name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 换回你原本代码里的高版本，确保 intl 库不报错
          flutter-version: "3.38.9" 
          channel: 'stable'

      - name: Pub get
        working-directory: simple_live_app
        run: flutter pub get

      # 【核心补丁】保留这一步，专门修你最早遇到的那个 Gradle null 报错
      - name: Create local.properties
        run: |
          mkdir -p simple_live_app/android
          echo "sdk.dir=$ANDROID_SDK_ROOT" > simple_live_app/android/local.properties
          echo "flutter.sdk=$FLUTTER_HOME" >> simple_live_app/android/local.properties
          echo "flutter.versionName=1.0.0" >> simple_live_app/android/local.properties
          echo "flutter.versionCode=1" >> simple_live_app/android/local.properties

      - name: Build APK
        working-directory: simple_live_app
        # 加入 --no-tree-shake-icons 是为了防止有些图标导致编译失败
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons --build-name=1.0.0 --build-number=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-APK
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
